<!DOCTYPE html>
<html>

<head>
    <title>
        BattleShip
    </title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="css-center-div">
        <h1 class="css-title">battleShip.js</h1>
    </div>
    <div class="css-center-div">
        <div class="css-game-screen">
            <div class="css-panel-left">
                <h3>Game Stages</h3>
                <ol>
                    <li>Place Boats</li>
                    <li>Play Game</li>
                    <li>Win/Lose</li>
                </ol>
                <button id="end-game-btn" class="css-end-game-btn">End Game</button>
            </div>

            <div class="css-board js-board">
            </div>
            <div class="css-start-menu js-start-menu">
                <button id="start-game-btn" class="css-start-game-btn">Start Game</button>
                <button id="options-btn" class="css-options-btn">Options</button>
            </div>
            <div class="css-panel-right">
                <p>Boats</p>
                <ul>
                    <li>Carrier (5 holes)</li>
                    <li>Battleship (4 holes)</li>
                    <li>Cruiser (3 holes)</li>
                    <li>Submarine (3 holes)</li>
                    <li>Destroyer (2 holes)</li>
                </ul>
            </div>
        </div>
    </div>
    <div class="css-center-div">
        <!-- bottom section -->
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
